{% extends "base.html" %}

{% block title %}Entrar · Janela de Coleta{% endblock %}

{% block content %}
  <h1>Entrar</h1>
  <form method="post" class="sheet">
    {% csrf_token %}
    {{ form.non_field_errors }}
    {% for field in form %}
      <div class="field">
        {{ field.label_tag }}
        {{ field }}
        {{ field.errors }}
      </div>
    {% endfor %}
    <button type="submit">Entrar</button>
  </form>
  <p class="muted">Não tem conta? <a href="{% url 'signup' %}">Cadastre-se</a>.</p>
{% endblock %}
